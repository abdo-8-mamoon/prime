<body>
<div class="app" id="app"></div><dialog id="modal" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='mamoon-prime-single-html-v1';

const fresh=()=>({tasks:[],habits:[],goals:[],areas:['Education','Career','Programming & AI','Health & Fitness','Personal Development','Family & Relationships','Finance','Spirituality','Personal Projects'],plans:{},journal:{},sessions:[],settings:{name:'Mamoon',theme:'dark',lang:'en',defaultDuration:45,wake:'06:30',sleep:'22:30',weekStart:1},widget:{focus:true,timeline:true,habits:true},focus:{until:0,started:0,duration:25,paused:0,taskId:''}});
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')};state.settings={...fresh().settings,...state.settings};state.widget={...fresh().widget,...state.widget};state.focus={...fresh().focus,...state.focus};}catch{state=fresh()}
let section='dashboard',taskView='list',selectedDate=todayISO(),calMonth=new Date(),journalDate=todayISO(),searchTerm='',taskFilter={status:'all',priority:'all',area:'all'},timerTick=null,reminderTimer=null,toastTimer=null,searchDelay=null;
const nav=[['dashboard','◈','Dashboard'],['day','◷','My Day'],['tasks','☷','Tasks'],['calendar','▦','Calendar'],['goals','◎','Goals'],['habits','✳','Habits'],['focus','◉','Focus Mode'],['areas','⌘','Life Areas'],['analytics','▤','Progress & Analytics'],['journal','▧','Daily Journal'],['settings','⚙','Settings']];
const quotes=['Small actions, repeated with intention, become a remarkable life.','The secret of your future is hidden in your daily routine.','Clarity creates momentum. Choose the next useful step.','Discipline is the bridge between intention and achievement.','Make room for the work that moves your life forward.','Progress is built quietly, one deliberate hour at a time.','Own your time. Give your best energy to what matters.'];
const tr={en:{Dashboard:'Dashboard','My Day':'My Day',Tasks:'Tasks',Calendar:'Calendar',Goals:'Goals',Habits:'Habits','Focus Mode':'Focus Mode','Life Areas':'Life Areas','Progress & Analytics':'Progress & Analytics','Daily Journal':'Daily Journal',Settings:'Settings',Search:'Search tasks, goals, habits…',AddTask:'+ Add task','Plan my day':'Plan my day','Plan tomorrow':'Plan tomorrow'},ar:{Dashboard:'لوحة القيادة','My Day':'يومي',Tasks:'المهام',Calendar:'التقويم',Goals:'الأهداف',Habits:'العادات','Focus Mode':'وضع التركيز','Life Areas':'مجالات الحياة','Progress & Analytics':'التقدم والتحليلات','Daily Journal':'اليوميات',Settings:'الإعدادات',Search:'ابحث في المهام والأهداف…',AddTask:'+ مهمة جديدة','Plan my day':'خطط ليومي','Plan tomorrow':'خطط للغد'}};
const t=s=>(tr[state.settings.lang]||tr.en)[s]||s;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Could not save. Browser storage may be full.','error')}};
const fmtDate=(iso,opts={weekday:'long',month:'long',day:'numeric'})=>{if(!iso)return'';return new Date(iso+'T12:00:00').toLocaleDateString(state.settings.lang==='ar'?'ar':'en-US',opts)};
const isoShift=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return todayISOFrom(d)};
function todayISOFrom(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
const taskById=id=>state.tasks.find(x=>x.id===id);
const tasksFor=(date)=>state.tasks.filter(x=>x.date===date).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
const activeTasks=()=>state.tasks.filter(x=>!x.done);
const completedToday=()=>state.tasks.filter(x=>x.done&&((x.completedAt||'').slice(0,10)===todayISO())).length;
const todayMinutes=()=>state.sessions.filter(s=>s.date===todayISO()).reduce((n,s)=>n+(+s.minutes||0),0);
function currentStreak(){if(!state.habits.length)return 0;let best=0;for(const h of state.habits){let n=0;for(let i=0;i<365;i++){const day=isoShift(todayISO(),-i);if((h.logs||[]).includes(day))n++;else if(i===0)continue;else break}best=Math.max(best,n)}return best}
function quoteToday(){const d=new Date();return quotes[(Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/86400000))%quotes.length]}

function iconFor(id){return nav.find(x=>x[0]===id)?.[1]||'◈'}
function navButton(item,mobile=false){return `<button class="${section===item[0]?'nav-item active':'nav-item'} ${mobile?'':'nav-item'}" data-section="${item[0]}" aria-label="${esc(t(item[2]))}" ${section===item[0]?'aria-current="page"':''}><span class="nav-ico">${item[1]}</span><span>${esc(t(item[2]))}</span></button>`}
function go(s){section=s;render()}
function renderShell(){const mnav=[nav[0],nav[2],nav[4],nav[6],nav[10]];document.documentElement.lang=state.settings.lang;document.documentElement.dir=state.settings.lang==='ar'?'rtl':'ltr';document.documentElement.classList.toggle('light',state.settings.theme==='light');document.body.classList.toggle('rtl',state.settings.lang==='ar');document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18 9.1 7.4 12 13l2.3-4.2L20.5 18H3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 18h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><div><div class="brand-name">MAMOON PRIME</div><div class="brand-tag">Own your time</div></div></div><div class="nav-label">Workspace</div><nav class="nav-list">${nav.slice(0,7).map(x=>navButton(x)).join('')}</nav><div class="nav-spacer"></div><div class="nav-label">Personal growth</div><nav class="nav-list">${nav.slice(7).map(x=>navButton(x)).join('')}</nav><div class="sidebar-bottom"><div class="side-quote"><small>Daily reminder</small><p>“Discipline creates freedom.”</p></div><div class="profile"><div class="avatar">${esc((state.settings.name||'M').slice(0,1).toUpperCase())}</div><div><div class="profile-name">${esc(state.settings.name||'Mamoon')}</div><div class="profile-caption">Personal workspace · This browser</div></div></div></div></aside><main class="main"><header class="topbar"><div class="top-left"><div class="mobile-brand"><div class="brand-mark">⌃</div>MAMOON PRIME</div><div class="crumb">Workspace <span style="color:var(--subtle)"> / </span> <b>${esc(t(nav.find(x=>x[0]===section)?.[2]||'Dashboard'))}</b></div></div><div class="top-actions"><label class="search-box"><span>⌕</span><input id="global-search" placeholder="${esc(t('Search'))}" value="${esc(searchTerm)}" aria-label="Search"><kbd>/</kbd></label><button class="icon-btn" data-action="theme" title="Toggle theme" aria-label="Toggle theme">${state.settings.theme==='dark'?'☼':'☾'}</button><button class="icon-btn" data-action="help" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">?</button><button class="primary-btn" data-action="new-task"><span>＋</span><span class="quick-label">${esc(t('AddTask'))}</span></button></div></header><div class="content" id="content">${renderSection()}</div></main><nav class="mobile-nav">${mnav.map(x=>`<button class="${section===x[0]?'active':''}" data-section="${x[0]}"><span>${x[1]}</span><span>${esc(t(x[2]))}</span></button>`).join('')}</nav>`;}
function head(title,sub='',actions=''){return `<div class="page-head"><div><div class="eyebrow">Mamoon Prime</div><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:''}</div><div class="head-actions">${actions}</div></div>`}
function stat(label,num,note,ico){return `<article class="stat"><div class="stat-top"><span>${esc(label)}</span><span class="stat-icon">${ico}</span></div><div class="stat-num">${esc(num)}</div><div class="stat-note">${esc(note)}</div></article>`}
function empty(title,desc,action=''){return `<div class="empty"><div class="empty-mark">✦</div><strong>${esc(title)}</strong><p>${esc(desc)}</p>${action}</div>`}
function taskMarkup(task,compact=false){const when=[task.time||'',task.duration?`${task.duration} min`:'',task.area||''].filter(Boolean).join(' · ');return `<div class="task-row"><input class="check" type="checkbox" data-action="toggle-task" data-id="${esc(task.id)}" ${task.done?'checked':''} aria-label="Mark ${esc(task.title)} ${task.done?'incomplete':'complete'}"><div style="min-width:0"><div class="task-title ${task.done?'done':''}">${esc(task.title)}</div><div class="task-meta">${esc(when||task.date||'No time set')}${task.repeat&&task.repeat!=='none'?' · ↻ '+esc(task.repeat):''}</div></div><div style="display:flex;align-items:center;gap:5px"><span class="priority ${esc(task.priority||'Medium')}">${esc(task.priority||'Medium')}</span><button class="small-btn" data-action="edit-task" data-id="${esc(task.id)}" aria-label="Edit task">⋯</button></div></div>`}
function dashboard(){const todo=tasksFor(todayISO()),done=todo.filter(x=>x.done).length,left=todo.length-done,pct=todo.length?Math.round(done/todo.length*100):0,week=state.tasks.filter(x=>x.date>=isoShift(todayISO(),-6)&&x.date<=todayISO()),weekRate=week.length?Math.round(week.filter(x=>x.done).length/week.length*100):0;const overdue=state.tasks.filter(x=>!x.done&&x.date<todayISO());const q=quoteToday();const due=todo.filter(x=>!x.done);const top=state.plans[todayISO()]?.top||[];let priorityHtml=top.length?top.map(id=>taskById(id)).filter(Boolean).map(x=>taskMarkup(x,true)).join(''):'';return `${head('Your day, in focus',fmtDate(todayISO(),{weekday:'long',month:'long',day:'numeric',year:'numeric'}),`<button class="soft-btn" data-action="plan-tomorrow">◷ ${esc(t('Plan tomorrow'))}</button><button class="primary-btn" data-section="day">${esc(t('Plan my day'))} →</button>`)}<section class="hero"><div class="hero-copy"><div class="hero-date">${esc(greet())}, ${esc(state.settings.name||'Mamoon')} · ${esc(fmtDate(todayISO(),{month:'long',day:'numeric'}))}</div><h2>Make today count.</h2><p>Bring your attention to what matters. One deliberate block at a time.</p><button class="primary-btn" data-section="day">Open today’s plan <span>↗</span></button><div class="quote-line"><em>“${esc(q)}”</em></div></div></section><section class="stats">${stat('Completed today',done,'Tasks finished today','✓')}${stat('Still to do',left,'Scheduled for today','◷')}${stat('Weekly progress',week.length?`${weekRate}%`:'—',`${week.length} tasks scheduled this week`,'▤')}${stat('Habit streak',currentStreak(),state.habits.length?'Consecutive days at your best':'Add a habit to begin','✳')}${stat('Focused today',todayMinutes()?`${Math.floor(todayMinutes()/60)}h ${todayMinutes()%60}m`:'0 min','Recorded focus time','◉')}</section><div class="dashboard-grid"><div><section class="panel"><div class="panel-head"><div><div class="panel-title">Today’s progress</div><div class="panel-sub">A clear view of what you planned and what you moved forward</div></div><button class="text-link" data-section="analytics">View insights →</button></div><div class="ring-row"><div class="ring" style="--pct:${pct}"><div class="ring-inner"><strong>${pct}%</strong><small>complete</small></div></div><div class="ring-copy"><strong>${todo.length?`${done} of ${todo.length} tasks complete`:'A fresh page'}</strong><p>${todo.length?left?`${left} ${left===1?'task':'tasks'} still ahead. Keep your pace intentional.`:'You’ve completed today’s plan. Take a moment to reflect.':'Add the first task to give your day direction.'}</p><button class="text-link" data-action="new-task">＋ Capture a task</button></div></div></section><section class="panel" data-widget-panel="timeline" style="${state.widget.timeline?'':'display:none'}"><div class="panel-head"><div><div class="panel-title">Today’s schedule</div><div class="panel-sub">Your planned blocks, in order</div></div><button class="text-link" data-section="calendar">Calendar →</button></div>${todo.length?`<div class="timeline">${todo.map(x=>`<div class="timeline-row"><span class="timeline-time">${esc(x.time||'Anytime')}</span><span><span class="timeline-name ${x.done?'done':''}">${esc(x.title)}</span><span class="timeline-meta"> · ${esc(x.duration||30)} min</span></span><span class="priority ${esc(x.priority||'Medium')}">${esc(x.priority||'Medium')}</span></div>`).join('')}</div>`:empty('Nothing scheduled yet','Give your day a little structure. Your plan is saved in this browser.',`<button class="soft-btn" data-action="new-task">Create your first task</button>`)}</section><section class="panel"><div class="panel-head"><div><div class="panel-title">Top three priorities</div><div class="panel-sub">Choose the work that deserves your best energy</div></div><button class="text-link" data-section="day">Set priorities →</button></div>${priorityHtml||empty('Set your top three','Choose up to three tasks in My Day so your priorities stay visible.')}</section></div><div><section class="panel"><div class="panel-head"><div><div class="panel-title">Up next</div><div class="panel-sub">The next commitments on your list</div></div><button class="text-link" data-section="tasks">All tasks →</button></div>${due.length?`<div class="task-list">${due.slice(0,5).map(x=>taskMarkup(x,true)).join('')}</div>`:empty('Your day is open','Add a task when you are ready to make a plan.',`<button class="soft-btn" data-action="new-task">＋ Add a task</button>`)}</section><section class="panel" data-widget-panel="habits" style="${state.widget.habits?'':'display:none'}"><div class="panel-head"><div><div class="panel-title">Today’s habits</div><div class="panel-sub">Consistency, without the pressure</div></div><button class="text-link" data-section="habits">All habits →</button></div>${state.habits.length?`<div class="habit-mini">${state.habits.map(h=>`<div class="habit-line"><span class="habit-dot" style="background:${esc(h.color||'var(--blue)')}"></span><span class="habit-name">${esc(h.name)}</span><span class="habit-streak">${(h.logs||[]).includes(todayISO())?'Done ✓':`${(h.logs||[]).length} total`}</span><input class="check" type="checkbox" data-action="toggle-habit" data-id="${esc(h.id)}" ${(h.logs||[]).includes(todayISO())?'checked':''} aria-label="Complete habit"></div>`).join('')}</div>`:empty('Start with one small habit','Choose something repeatable and make it your own.',`<button class="soft-btn" data-action="new-habit">＋ Create habit</button>`)}</section>${overdue.length?`<section class="panel"><div class="panel-head"><div><div class="panel-title" style="color:var(--amber)">Needs a decision</div><div class="panel-sub">Overdue tasks are never silently moved</div></div></div><div class="task-list">${overdue.slice(0,4).map(x=>taskMarkup(x,true)).join('')}</div></section>`:`<section class="panel" data-widget-panel="focus" style="${state.widget.focus?'':'display:none'}"><div class="panel-head"><div><div class="panel-title">Focus time</div><div class="pa label for="journal-wins">A win from today</label><textarea id="journal-wins" data-journal="wins" placeholder="It counts, even if it was small.">${esc(entry.wins||'')}</textarea></div><div class="field"><label for="journal-challenges">What challenged me?</label><textarea id="journal-challenges" data-journal="challenges" placeholder="Name it without judgment.">${esc(entry.challenges||'')}</textarea></div><div class="field"><label for="journal-tomorrow">Tomorrow’s priorities</label><textarea id="journal-tomorrow" data-journal="tomorrow" placeholder="What deserves your attention next?"></textarea></div></div></section></div>`}
function settingsPage(){return `${head('Settings','Make your workspace feel like yours.') }<div class="dashboard-grid"><section><div class="panel"><div class="panel-head"><div><div class="panel-title">Your preferences</div><div class="panel-sub">Saved only in this browser</div></div></div><div class="field-row"><div class="field"><label for="pref-name">Profile name</label><input id="pref-name" value="${esc(state.settings.name)}" maxlength="50"></div><div class="field"><label for="pref-lang">Language / لغة</label><select id="pref-lang"><option value="en" ${state.settings.lang==='en'?'selected':''}>English</option><option value="ar" ${state.settings.lang==='ar'?'selected':''}>العربية — RTL</option></select></div></div><div class="field-row" style="margin-top:12px"><div class="field"><label for="pref-wake">Wake-up time</label><input id="pref-wake" type="time" value="${esc(state.settings.wake)}"></div><div class="field"><label for="pref-sleep">Sleep time</label><input id="pref-sleep" type="time" value="${esc(state.settings.sleep)}"></div></div><div class="field" style="margin-top:12px"><label for="pref-duration">Default task duration (minutes)</label><input id="pref-duration" type="number" min="5" max="480" value="${esc(state.settings.defaultDuration)}"></div><div class="switch-row"><div><strong>Light theme</strong><small>Switch between midnight and daylight</small></div><input class="toggle" type="checkbox" id="pref-theme" ${state.settings.theme==='light'?'checked':''}></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Dashboard widgets</div><div class="panel-sub">Choose what appears on your command center</div></div></div>${[['focus','Focus time'],['timeline','Today’s timeline'],['habits','Today’s habits']].map(([id,label])=>`<div class="switch-row"><div><strong>${label}</strong></div><input class="toggle" type="checkbox" data-widget="${id}" ${state.widget[id]?'checked':''}></div>`).join('')}</div></section><section><div class="panel"><div class="panel-head"><div><div class="panel-title">Reminders</div><div class="panel-sub">Permission is requested only after your explanation</div></div></div><div class="alert-note">This single-file version can show browser notifications while the page is open, if your browser supports them and you grant permission. It cannot reliably send notifications after you close the page. This file has no server-side push service.</div><div style="margin-top:12px"><button class="soft-btn" data-action="explain-notifications">${('Notification'in window?Notification.permission:'unavailable')==='granted'?'Notifications enabled in browser':'Explain & enable notifications'}</button></div><div class="footnote">Current browser permission: ${esc('Notification'in window?Notification.permission:'unavailable')}</div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Your data</div><div class="panel-sub">Export a backup or clear local records</div></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="soft-btn" data-action="export-json">Download JSON backup</button><button class="ghost-btn" data-action="export-csv">Export tasks as CSV</button><button class="ghost-btn" data-action="import-json">Import backup</button><input type="file" id="import-file" accept="application/json,.json" class="hidden"></div><div style="margin-top:12px"><button class="danger-btn" data-action="clear-data">Clear all data from this browser</button></div><div class="footnote">Data is stored in localStorage on this device, not encrypted or synced. Avoid using this file on a shared browser. Export backups regularly.</div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Keyboard shortcuts</div><div class="panel-sub">Press ? to see the full list</div></div></div><div class="kbd-help"><span>Quick-add task</span><kbd>N</kbd></div><div class="kbd-help"><span>Search</span><kbd>/</kbd></div><div class="kbd-help"><span>Shortcuts help</span><kbd>?</kbd></div></div></section></div>`}
function searchPage(){const q=searchTerm.toLowerCase();if(!q)return `${head('Search','Search across your personal workspace.')}${empty('Search everything','Use the search field above to find tasks, goals, habits, and journal entries.')}`;const matches=[...state.tasks.filter(x=>`${x.title} ${x.description||''}`.toLowerCase().includes(q)).map(x=>({type:'Task',title:x.title,meta:x.date,action:'edit-task',id:x.id})),...state.goals.filter(x=>`${x.title} ${x.description||''}`.toLowerCase().includes(q)).map(x=>({type:'Goal',title:x.title,meta:`${x.progress||0}% complete`,action:'edit-goal',id:x.id})),...state.habits.filter(x=>x.name.toLowerCase().includes(q)).map(x=>({type:'Habit',title:x.name,meta:'Habit',action:'',id:x.id})),...Object.entries(state.journal).filter(([,x])=>JSON.stringify(x).toLowerCase().includes(q)).map(([d])=>({type:'Journal',title:fmtDate(d,{month:'short',day:'numeric',year:'numeric'}),meta:'Journal entry',action:'journal-date',date:d}))];return `${head('Search results',`Matches for “${searchTerm}”`)}<section class="panel">${matches.length?matches.map(x=>`<div class="task-row" ${x.action?`data-action="${x.action}" data-id="${esc(x.id||'')}" data-date="${esc(x.date||'')}"`:''}><span class="stat-icon">${x.type==='Task'?'☷':x.type==='Goal'?'◎':x.type==='Habit'?'✳':'▧'}</span><div><div class="task-title">${esc(x.title)}</div><div class="task-meta">${esc(x.type)} · ${esc(x.meta||'')}</div></div><span class="text-link">Open →</span></div>`).join(''):empty('No matches','Try another search term.')}</section>`}
function renderSection(){switch(section){case'dashboard':return dashboard();case'day':return dayPage();case'tasks':return tasksPage();case'calendar':return calendarPage();case'goals':return goalsPage();case'habits':return habitsPage();case'focus':return focusPage();case'areas':return areasPage();case'analytics':return analyticsPage();case'journal':return journalPage();case'settings':return settingsPage();case'search':return searchPage();default:return dashboard()}}

function taskForm(task=null,date=null){const x=task||{title:'',description:'',date:date||selectedDate||todayISO(),time:'',due:'',duration:state.settings.defaultDuration,priority:'Medium',area:state.areas[0]||'',repeat:'none',tags:[],checklist:[]};dialog(task?'Edit task':'Create a task',`<form id="task-form" class="form-stack" data-id="${esc(task?.id||'')}"><div class="field"><label for="task-title">Task title *</label><input id="task-title" name="title" required maxlength="140" placeholder="What needs your attention?" value="${esc(x.title)}" autofocus></div><div class="field"><label for="task-desc">Notes</label><textarea id="task-desc" name="description" maxlength="2000" placeholder="Add context, if useful">${esc(x.description||'')}</textarea></div><div class="field-row"><div class="field"><label>Date</label><input name="date" type="date" value="${esc(x.date||'')}" required></div><div class="field"><label>Start time</label><input name="time" type="time" value="${esc(x.time||'')}"></div></div><div class="field-row"><div class="field"><label>Duration (minutes)</label><input name="duration" type="number" min="5" max="720" value="${esc(x.duration||30)}"></div><div class="field"><label>Priority</label><select name="priority">${['Low','Medium','High','Critical'].map(p=>`<option ${x.priority===p?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="field-row"><div class="field"><label>Life area</label><select name="area"><option value="">Unassigned</option>${state.areas.map(a=>`<option ${x.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="field"><label>Repeat</label><select name="repeat">${[['none','Does not repeat'],['daily','Daily'],['weekly','Weekly']].map(([v,l])=>`<option value="${v}" ${x.repeat===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="field"><label>Tags (comma-separated)</label><input name="tags" value="${esc((x.tags||[]).join(', '))}" placeholder="study, important"></div><div class="field"><label>Checklist items (one per line)</label><textarea name="checklist" placeholder="Optional small steps">${esc((x.checklist||[]).map(c=>typeof c==='string'?c:c.text).join('\n'))}</textarea></div><div class="dialog-foot">${task?`<button type="button" class="danger-btn" data-action="delete-task" data-id="${esc(task.id)}">Delete</button>`:''}<span style="flex:1"></span><button type="button" class="ghost-btn" data-action="close-modal">Cancel</button><button class="primary-btn" type="submit">Save task</button></div></form>`)}
function habitForm(){dialog('Create a habit',`<form id="habit-form" class="form-stack"><div class="field"><label>Habit name *</label><input name="name" required maxlength="80" placeholder="Read for 20 minutes"></div><div class="field"><label>Description</label><input name="description" maxlength="180" placeholder="A small repeatable action"></div><div class="field-row"><div class="field"><label>Frequency</label><select name="frequency"><option>Daily</option><option>Weekdays</option><option>Weekly</option></select></div><div class="field"><label>Target</label><input name="target" placeholder="One check-in"></div></div><div class="field-row"><div class="field"><label>Icon</label><input name="icon" value="✳" maxlength="3"></div><div class="field"><label>Color</label><input name="color" type="color" value="#72b8ff"></div></div><div class="dialog-foot"><span style="flex:1"></span><button type="button" class="ghost-btn" data-action="close-modal">Cancel</button><button class="primary-btn" type="submit">Create habit</button></div></form>`)}
function goalForm(goal=null){const g=goal||{title:'',description:'',area:state.areas[0]||'',targetDate:'',progress:0};dialog(goal?'Edit goal':'Create a goal',`<form id="goal-form" class="form-stack" data-id="${esc(goal?.id||'')}"><div class="field"><label>Goal *</label><input name="title" required maxlength="120" value="${esc(g.title)}" placeholder="What do you want to make possible?"></div><div class="field"><label>Why it matters / next milestone</label><textarea name="description" maxlength="1000" placeholder="Keep the next step visible">${esc(g.description||'')}</textarea></div><div class="field-row"><div class="field"><label>Life area</label><select name="area">${state.areas.map(a=>`<option ${g.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="field"><label>Target date</label><input name="targetDate" type="date" value="${esc(g.targetDate||'')}"></div></div><div class="field"><label>Progress (%)</label><input name="progress" type="number" min="0" max="100" value="${esc(g.progress||0)}"></div><div class="dialog-foot"><span style="flex:1"></span><button type="button" class="ghost-btn" data-action="close-modal">Cancel</button><button class="primary-btn" type="submit">Save goal</button></div></form>`)}
function startTimerTick(){clearInterval(timerTick);timerTick=setInterval(()=>{if(!state.focus.until){clearInterval(timerTick);return}if(state.focus.until<=Date.now()){finishFocus();return}if(section==='focus')render();},1000)}
function finishFocus(){const f=state.focus;const mins=Math.max(1,Math.round((Date.now()-(f.started||Date.now()))/60000));state.sessions.push({id:uid(),date:todayISO(),minutes:mins,title:taskById(f.taskId)?.title||'Focus session',at:new Date().toISOString()});state.focus.until=0;state.focus.started=0;state.focus.paused=0;save();clearInterval(timerTick);notify('Focus session complete. Take a breath.');render()}
function startFocus(){let mins=Math.max(1,Math.min(180,+document.getElementById('focus-mins')?.value||state.focus.duration));state.focus.duration=mins;state.focus.taskId=document.getElementById('focus-task')?.value||state.focus.taskId;state.focus.started=Date.now();state.focus.until=Date.now()+mins*60000;state.focus.paused=0;save();startTimerTick();render()}
function checkReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=Date.now();for(const x of state.tasks){if(x.done||!x.date||!x.time)continue;const when=new Date(`${x.date}T${x.time}`).getTime();if(Math.abs(when-now)<=30000){const k=`${x.id}-${x.date}-${x.time}`;if(localStorage.getItem('mp-notified-'+k))continue;new Notification('Mamoon Prime · Up next',{body:`${x.title} · ${x.time}`,tag:k});localStorage.setItem('mp-notified-'+k,'1')}}}
function scheduleSaved(){if(reminderTimer)clearInterval(reminderTimer);reminderTimer=setInterval(checkReminders,15000)}
function updateJournal(field,value){const e=state.journal[journalDate]||{text:'',mood:'',gratitude:'',wins:'',challenges:'',tomorrow:''};e[field]=value;state.journal[journalDate]=e;save()}
function updatePlan(){const d=selectedDate;const p=state.plans[d]||{};p.wake=document.getElementById('wake-time')?.value||p.wake;p.sleep=document.getElementById('sleep-time')?.value||p.sleep;p.top=[...document.querySelectorAll('[data-top-index]')].map(x=>x.value).filter(Boolean).slice(0,3);state.plans[d]=p;save()}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function taskSubmit(form){const fd=new FormData(form),id=form.dataset.id;const old=taskById(id);const title=String(fd.get('title')||'').trim();if(!title)return;const task={...(old||{}),id:id||uid(),title,description:String(fd.get('description')||'').trim(),date:String(fd.get('date')||''),time:String(fd.get('time')||''),duration:Math.max(5,Math.min(720,+fd.get('duration')||30)),priority:String(fd.get('priority')||'Medium'),area:String(fd.get('area')||''),repeat:String(fd.get('repeat')||'none'),tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean),checklist:String(fd.get('checklist')||'').split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({text,done:false})),updatedAt:new Date().toISOString()};if(old)state.tasks=state.tasks.map(x=>x.id===id?task:x);else{task.createdAt=new Date().toISOString();task.done=false;state.tasks.push(task)};save();document.getElementById('modal').close();notify(old?'Task updated':'Task saved');render()}
function toggleTask(id){const x=taskById(id);if(!x)return;x.done=!x.done;if(x.done){x.completedAt=new Date().toISOString();if(x.repeat==='daily'||x.repeat==='weekly'){const d=new Date((x.date||todayISO())+'T12:00:00');d.setDate(d.getDate()+(x.repeat==='daily'?1:7));const nd=todayISOFrom(d);if(!state.tasks.some(t=>t.originId===x.id&&t.date===nd)){state.tasks.push({...x,id:uid(),originId:x.id,date:nd,done:false,completedAt:null,createdAt:new Date().toISOString()})}}}else x.completedAt=null;save();notify(x.done?'Task complete. Nice work.':'Task reopened');render()}
function toggleHabit(id,date=todayISO()){const h=state.habits.find(x=>x.id===id);if(!h)return;h.logs=h.logs||[];h.logs=h.logs.includes(date)?h.logs.filter(x=>x!==date):[...h.logs,date].sort();save();render()}
function addTask(){taskForm(null,selectedDate)}
function savePlanTemplate(name){const d=selectedDate,p=state.plans[d]||{};p.template=name;state.plans[d]=p;save();notify(`${name} template selected. Add or adjust the day’s tasks.`)}
function eventClick(e){const b=e.target.closest('[data-action],[data-section]');if(!b)return;if(b.dataset.section){go(b.dataset.section);return}const a=b.dataset.action,id=b.dataset.id;switch(a){case'new-task':taskForm(null,b.dataset.date||selectedDate);break;case'edit-task':taskForm(taskById(id));break;case'toggle-task':toggleTask(id);break;case'delete-task':if(confirm('Delete this task? This cannot be undone.')){state.tasks=state.tasks.filter(x=>x.id!==id);save();document.getElementById('modal').close();notify('Task deleted');render()}break;case'new-habit':habitForm();break;case'toggle-habit':toggleHabit(id);break;case'habit-day':toggleHabit(id,b.dataset.date);break;case'delete-habit':if(confirm('Remove this habit and its local check-in history?')){state.habits=state.habits.filter(x=>x.id!==id);save();render()}break;case'new-goal':goalForm();break;case'edit-goal':goalForm(state.goals.find(x=>x.id===id));break;case'delete-goal':if(confirm('Delete this goal?')){state.goals=state.goals.filter(x=>x.id!==id);save();render()}break;case'goal-step':{const g=state.goals.find(x=>x.id===id);if(g){g.progress=Math.max(0,Math.min(100,(+g.progress||0)+(+b.dataset.delta)));save();render()}}break;case'task-view':taskView=b.dataset.view;render();break;case'toggle-progress':{const x=taskById(id);if(x){x.progress=!x.progress;save();render()}}break;case'plan-tomorrow':selectedDate=isoShift(todayISO(),1);section='day';render();break;case'select-date':selectedDate=b.dataset.date;render();break;case'cal-prev':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);render();break;case'cal-next':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);render();break;case'cal-today':calMonth=new Date();selectedDate=todayISO();render();break;case'journal-date':journalDate=b.dataset.date;render();break;case'journal-today':journalDate=todayISO();render();break;case'mood':updateJournal('mood',b.dataset.mood);render();break;case'focus-start':startFocus();break;case'focus-pause':state.focus.paused=Math.max(0,state.focus.until-Date.now());state.focus.until=0;save();render();break;case'focus-resume':state.focus.started=Date.now()-(state.focus.duration*60000-state.focus.paused);state.focus.until=Date.now()+state.focus.paused;state.focus.paused=0;save();startTimerTick();render();break;case'focus-reset':state.focus.until=0;state.focus.started=0;state.focus.paused=0;save();clearInterval(timerTick);render();break;case'preset':state.focus.duration=+b.dataset.min;state.focus.paused=0;save();render();break;case'fullscreen':document.documentElement.requestFullscreen?.().catch(()=>notify('Full screen is not available here'));break;case'theme':state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render();break;case'help':dialog('Keyboard shortcuts',`<div class="kbd-help"><span>Quick-add a task</span><kbd>N</kbd></div><div class="kbd-help"><span>Focus the search field</span><kbd>/</kbd></div><div class="kbd-help"><span>Open this guide</span><kbd>?</kbd></div><div class="kbd-help"><span>Close the dialog</span><kbd>Esc</kbd></div>`);break;case'close-modal':document.getElementById('modal').close();break;case'new-area':{const a=prompt('Name your new life area');if(a&&a.trim()&&!state.areas.includes(a.trim())){state.areas.push(a.trim());save();render()}}break;case'rename-area':{const old=b.dataset.area,n=prompt('Rename life area',old);if(n&&n.trim()!==old){state.areas=state.areas.map(x=>x===old?n.trim():x);state.tasks.forEach(x=>{if(x.area===old)x.area=n.trim()});state.goals.forEach(x=>{if(x.area===old)x.area=n.trim()});save();render()}}break;case'remove-area':{const area=b.dataset.area;if(confirm(`Remove “${area}” from your areas? Existing tasks will become unassigned.`)){state.areas=state.areas.filter(x=>x!==area);state.tasks.forEach(x=>{if(x.area===area)x.area=''});state.goals.forEach(x=>{if(x.area===area)x.area='Personal'});save();render()}}break;case'duplicate-yesterday':{const y=isoShift(selectedDate,-1),src=tasksFor(y);if(!src.length){notify('No tasks found yesterday.');break}if(!confirm(`Copy ${src.length} task(s) from ${y} to ${selectedDate}? Existing tasks will remain.`))break;for(const x of src)state.tasks.push({...x,id:uid(),originId:x.id,date:selectedDate,done:false,completedAt:null,createdAt:new Date().toISOString()});save();notify('Yesterday’s tasks copied.');render()}break;case'export-json':download('mamoon-prime-backup-'+todayISO()+'.json',JSON.stringify(state,null,2),'application/json');break;case'export-csv':{const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';download('mamoon-prime-tasks-'+todayISO()+'.csv',['Title,Date,Time,Duration,Priority,Area,Status',...state.tasks.map(x=>[x.title,x.date,x.time,x.duration,x.priority,x.area,x.done?'Completed':'Open'].map(q).join(','))].join('\n'),'text/csv');break}case'import-json':document.getElementById('import-file')?.click();break;case'clear-data':if(confirm('Delete all tasks, habits, goals, journals, settings, and focus history saved by this file in this browser? Export a backup first if you need one.')){localStorage.removeItem(KEY);state=fresh();save();render();notify('Local data cleared')}break;case'explain-notifications':dialog('About reminders',`<div class="alert-note">This file can show notifications for scheduled tasks only while Mamoon Prime is open in this browser. Notification permissions are controlled by your browser and operating system. It cannot deliver reminders after you close this page.</div><div class="dialog-foot"><button class="ghost-btn" data-action="close-modal">Not now</button><button class="primary-btn" data-action="request-notifications">Continue to browser permission</button></div>`);break;case'request-notifications':document.getElementById('modal').close();if(!('Notification'in window)){notify('This browser does not support notifications.','error');break}Notification.requestPermission().then(p=>{notify(p==='granted'?'Permission granted. Keep this page open for reminders.':'Permission not granted. You can change it in browser settings.');scheduleSaved();render()});break;case'plan-template':savePlanTemplate(b.dataset.name);break;default:break}}
document.addEventListener('click',eventClick);
document.addEventListener('change',e=>{const el=e.target;if(el.id==='global-search'){searchTerm=el.value;section='search';render();const inp=document.getElementById('global-search');inp?.focus();inp?.setSelectionRange(inp.value.length,inp.value.length)}else if(el.id==='filter-status'){taskFilter.status=el.value;render()}else if(el.id==='filter-priority'){taskFilter.priority=el.value;render()}else if(el.id==='filter-area'){taskFilter.area=el.value;render()}else if(el.id==='plan-date'){selectedDate=el.value||todayISO();render()}else if(el.id==='plan-template'){savePlanTemplate(el.value)}else if(el.dataset.topIndex!==undefined){updatePlan()}else if(el.id==='wake-time'||el.id==='sleep-time'){updatePlan()}else if(el.id==='journal-date-input'){journalDate=el.value||todayISO();render()}else if(el.id==='focus-mins'){state.focus.duration=Math.max(1,Math.min(180,+el.value||25));save()}else if(el.id==='focus-task'){state.focus.taskId=el.value;save()}else if(el.id==='pref-lang'){state.settings.lang=el.value;save();render()}else if(el.id==='pref-theme'){state.settings.theme=el.checked?'light':'dark';save();render()}else if(el.dataset.widget){state.widget[el.dataset.widget]=el.checked;save()}else if(el.id==='import-file'&&el.files?.[0]){const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported||!Array.isArray(imported.tasks))throw Error('Invalid backup');if(confirm('Replace the data in this browser with the selected backup?')){state={...fresh(),...imported,settings:{...fresh().settings,...imported.settings}};save();render();notify('Backup imported')}}catch{notify('That file is not a valid Mamoon Prime backup.','error')}};reader.readAsText(el.files[0])}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='global-search'){searchTerm=el.value;clearTimeout(searchDelay);searchDelay=setTimeout(()=>{section='search';render();const x=document.getElementById('global-search');x?.focus();x?.setSelectionRange(x.value.length,x.value.length)},160);return}if(el.matches('[data-journal]'))updateJournal(el.dataset.journal,el.value);if(el.id==='pref-name'){state.settings.name=el.value;save()}if(el.id==='pref-wake'){state.settings.wake=el.value;save()}if(el.id==='pref-sleep'){state.settings.sleep=el.value;save()}if(el.id==='pref-duration'){state.settings.defaultDuration=Math.max(5,Math.min(480,+el.value||45));save()}if(el.dataset.review){const key='weeklyReview';state[key]=state[key]||{};state[key][el.dataset.review]=el.value;save()}});
document.addEventListener('submit',e=>{if(e.target.id==='task-form'){e.preventDefault();taskSubmit(e.target)}else if(e.target.id==='habit-form'){e.preventDefault();const fd=new FormData(e.target);state.habits.push({id:uid(),name:String(fd.get('name')).trim(),description:String(fd.get('description')||''),frequency:String(fd.get('frequency')),target:String(fd.get('target')||'One check-in'),icon:String(fd.get('icon')||'✳'),color:String(fd.get('color')||'#72b8ff'),logs:[]});save();document.getElementById('modal').close();notify('Habit added');render()}else if(e.target.id==='goal-form'){e.preventDefault();const fd=new FormData(e.target),id=e.target.dataset.id,old=state.goals.find(x=>x.id===id),goal={...(old||{}),id:id||uid(),title:String(fd.get('title')).trim(),description:String(fd.get('description')||''),area:String(fd.get('area')||''),targetDate:String(fd.get('targetDate')||''),progress:Math.max(0,Math.min(100,+fd.get('progress')||0))};if(old)state.goals=state.goals.map(x=>x.id===id?goal:x);else state.goals.push(goal);save();document.getElementById('modal').close();notify('Goal saved');render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')return;if(e.target.matches('input,textarea,select'))return;if(e.key.toLowerCase()==='n'){e.preventDefault();addTask()}else if(e.key==='/'){e.preventDefault();document.getElementById('global-search')?.focus()}else if(e.key==='?'){e.preventDefault();document.querySelector('[data-action="help"]')?.click()}});
render();scheduleSaved();if(state.focus.until&&state.focus.until<=Date.now())finishFocus();
})();
</script>
